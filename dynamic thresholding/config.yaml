# config.yml

# Rule 1: Odd-hour logins
odd_hour_login:
  start_hour: 8        # normal activity window start
  end_hour: 20         # normal activity window end
  score: 0.7           # severity score if rule is triggered

# Rule 2: Multiple logins in short time
multiple_logins:
  count_threshold: 4   # number of logins in short time to flag
  time_window_minutes: 10
  score: 0.8

# Rule 3: USB file write
usb_file_write:
  detection_field: "to_removable_media"  # column in dataset indicating USB write
  score: 0.9

# Rule 4: Mass file access
mass_file_access:
  file_count_threshold: 20                # number of files accessed in time window to flag
  time_window_hours: 1
  score: 1.0
